dataset_name: SLEEPEDFX  # PHYSIONETMI, SLEEPEDFX, SEEDV, BCI2A, TUAB, FACED, SIENA, SHUMI, KARAONE, BCI2020, CHISCO


data:
  batch_size: 64
  split_ratio: [0.8, 0.1, 0.1]
  num_workers: 4
  pin_memory: true
  persistent_workers: false
  seed: 100
  channel_mode: "raw"  # match pretraining (19-ch mapped layout); "raw" only with mode=channel_training
  return_ch_names: false


training:
  task: classification
  seed: 8
  model_name: EEGVAE  # EEGVAE, CBRAMOD, EEGMAMBA, LUNA, FEMBA, EEGPT, REVE
  model_config_path: /home/infres/yrothlin-24/EEG-VAE/configs/model_configs.yaml
  mode: channel_training  # linear_probing, channel_training, finetuning, full_training
  strict_checkpoint_loading: false

  # ── EEGVAE checkpoint selection ──────────────────────────────────────────────
  # The wrapper auto-detects ch, model_type (kl/vq), and vq_n_quantizers from the
  # checkpoint weights — no need to update the model section below when switching.
  # New checkpoint layout: {model_type}/{sequence_block}[/q{n}]/pretraining_final.pt
  #
  # Phase 1 mamba (KL-VAE):
  # model_weights: /projects/EEG-foundation-model/RECH202/EEG-VAE/checkpoints/pretraining/kl/mamba/pretraining_final.pt
  #
  # Phase 1 VQ-VAE (RVQ, mamba, q8):
  model_weights: /projects/EEG-foundation-model/RECH202/EEG-VAE/checkpoints/pretraining/vq/mamba/q8/pretraining_final.pt
  #
  # Phase 1 VQ-VAE (RVQ, transformers, q8):
  # model_weights: /projects/EEG-foundation-model/RECH202/EEG-VAE/checkpoints/pretraining/vq/transformers/q8/pretraining_final.pt
  #
  # Phase 2 JEPA:
  # model_weights: /projects/EEG-foundation-model/RECH202/EEG-VAE/checkpoints/jepa/jepa_final.pt

  loss_dir: /home/infres/yrothlin-24/EEG-VAE/logs/downstream/losses
  model_checkpoint_dir: /projects/EEG-foundation-model/RECH202/EEG-VAE/checkpoints/downstream

  tsne_enabled: false
  tsne_dir: /home/infres/yrothlin-24/EEG-VAE/logs/downstream/tsne
  tsne_splits: [train, val, test]
  tsne_max_samples: 2000
  tsne_perplexity: 30.0
  tsne_pca_enabled: true
  tsne_pca_components: 50
  tsne_pca_whiten: false
  tsne_learning_rate: auto
  tsne_max_iter: 1000
  tsne_random_state: 42
  tsne_dpi: 180
  tsne_figsize: [8, 6]
  tsne_feature_source: backbone

  num_epochs: 100
  device: "cuda"
  optimizer: "adamw"
  scheduler: "onecycle"  # cosine, step, plateau, onecycle, none
  lr: 0.0004
  max_lr: 0.0004  # used by onecycle; defaults to lr when null
  onecycle_pct_start: 0.2
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 10000.0
  weight_decay: 0.01
  betas: [0.9, 0.999]
  grad_clip: 1.0
  use_amp: false
  log_step: 50
  max_step_train: null
  max_step_val: null
  max_step_test: null

  loss: cross_entropy  # cross_entropy, label_smoothing, bce, mse, l1, smooth_l1
  label_smoothing: 0.0
  early_stopping_patience: 10
  early_stopping_min_delta: 0.0
  restore_best_checkpoint: true
  metric_monitoring: "BACC"  # BACC, ACC, AUROC, F1_macro, F1_weighted, KAPPA, val_loss
  plateau_factor: 0.5
  plateau_patience: 2


# Heads are now auto-selected per backbone in models/model.py and
# utils/downstream_wrapper.py. No `head:` section is needed anymore.
#
#   EEGVAE   → EEGVAEProbeHead   (models/eegvae_probe_head.py)
#   EEGPT    → EEGPTLinearProbeHead (models/eegpt_probe_head.py)
#   LUNA     → LunaProbeHead     (models/luna_probe_head.py)
#   CBRAMOD  → CBRAMODProbeHead  (models/cbramod_probe_head.py)
#   EEGMAMBA → EEGMambaProbeHead (models/eegmamba_probe_head.py)
#   FEMBA    → FEMBAProbeHead    (models/femba_probe_head.py)
#   REVE     → REVEProbeHead     (models/reve_probe_head.py)



model:
  in_channels: 19
  out_channels: 19

  adapted_channels: 64
  adaptor_layers: 2

  z_channels: 16
  embed_dim: 16

  ch: 64
  ch_mult: [1, 2, 4]

  num_res_blocks: 2
  attn_resolutions: []

  resolution: null

  dropout: 0.0
  resamp_with_conv: true

  tanh_out: false
  use_checkpoint: false
  sequence_block: attention  # attention, mamba
  criss_cross_patch_size: 200



